name: update-lck-calendar
# 실제 갱신은 Apps Script(apps-script/Code.gs)가 workflow_dispatch로 깨운다(경기 중 1분, 평소 15분).
# GitHub cron은 부하 시 몇 시간씩 밀리므로 예비용으로만 둔다.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# 1분 간격 dispatch가 진행 중인 실행을 취소하지 않도록 대기(pending은 GitHub가 1개만 유지)
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - id: gen
        run: |
          out=$(python fetch_schedule.py)
          echo "$out"
          echo "changed=$([[ "$out" == *NO_CHANGE* ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      # 커밋 메시지에 [skip ci]를 넣지 않는다: Pages 배포(pages-build-deployment)까지 건너뛸 수 있음.
      # GITHUB_TOKEN 푸시는 이 워크플로를 다시 트리거하지 않으므로 루프 걱정은 없다.
      - if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name  "lck-cal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          git commit -m "update: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
